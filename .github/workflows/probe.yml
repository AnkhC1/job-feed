name: Probe board tokens (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python probe_boards.py
      - run: |
          git config user.name "job-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add probe_results.md
          git commit -m "Probe results"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
